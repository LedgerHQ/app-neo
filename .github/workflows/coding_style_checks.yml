name: Run coding style check through reusable workflow

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  check_linting:
    name: Check sources linting
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_lint.yml@v1
    with:
      source: './src'
      extensions: 'h,c'

  tests_lint_check:
    name: Check tests linting
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_python_checks.yml@v1
    with:
      run_type_check: true
      src_directory: .
      req_directory: test
      setup_directory: test
